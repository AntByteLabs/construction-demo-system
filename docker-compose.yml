services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: antbyte-business-website-demo:latest
    container_name: antbyte-business-website-demo
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "file:/app/data/prod.db"
      # Set SEED_DB=1 in .env on the very first boot to populate demo data,
      # then remove it (or set to 0) so subsequent restarts don't re-seed.
      SEED_DB: "${SEED_DB:-0}"
    volumes:
      - app-db:/app/data
      - app-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app-db:
  app-uploads:
