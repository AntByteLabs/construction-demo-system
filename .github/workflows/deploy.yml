name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for workflow context only)
        uses: actions/checkout@v4

      # =========================
      # PRODUCTION DEPLOY
      # =========================
      # Required GitHub secrets:
      #   VPS_HOST     -> ssh host / IP
      #   VPS_USER     -> ssh user
      #   VPS_SSH_KEY  -> private key authorized on the VPS
      #
      # One-time VPS setup:
      #   - install docker + docker compose plugin
      #   - git clone <repo> ~/apps/antbyte-business-website-demo
      #   - cp .env.example .env   (set SEED_DB=1 for the first boot only)
      - name: Deploy to VPS (Production)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/antbyte-business-website-demo
            echo "Deploying PRODUCTION..."
            git fetch origin
            git checkout -B main origin/main
            git pull origin main
            rm -rf .next
            docker compose -f docker-compose.yml down
            docker compose -f docker-compose.yml build --no-cache
            docker compose -f docker-compose.yml up -d
            docker image prune -f
            echo "Production deployed on :5000"
